对于缩进，有的人喜欢t 有的人喜欢空格<br>
<br>
我就喜欢空格<br>
<br>
所以我写了一个插件 tabless.el 提供函数tabless能把当前buffer里所有的t全转换为四个空格<br>
<br>
目前只提供了emacs版本<br>
<br>
如果vim vscode或其他编辑其用户需要的话 这东西这么简单重写一边也不困难: )<br>
<br>
同样的 有人不喜欢四空格 而喜欢两空格甚至八空格 本插件同样也不能用参数调整 需要的话去该源码把 : ) : ) : )<br>
